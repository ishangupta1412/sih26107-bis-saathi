<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="220">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B18" />
      <stop offset="100%" stop-color="#02050D" />
    </linearGradient>

    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="1" />
    </linearGradient>

    <filter id="hudGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes laserSweep {
      0% { transform: translateY(15px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(175px); opacity: 0; }
    }
    @keyframes hudBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes barFill {
      0% { width: 0px; }
      70%, 100% { width: 140px; }
    }
    .laser-line {
      animation: laserSweep 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .hud-blink {
      animation: hudBlink 1.8s ease-in-out infinite;
    }
    .bar-anim {
      animation: barFill 3s ease-out infinite;
    }
    .mono {
      font-family: 'Fira Code', 'Courier New', monospace;
    }
  </style>

  <!-- Container Box -->
  <rect width="840" height="220" rx="12" fill="url(#hudBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Left: Simulated Label Packaging Area -->
  <g transform="translate(30, 20)">
    <!-- Package Frame -->
    <rect x="0" y="0" width="220" height="180" rx="8" fill="#0A1124" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4" />
    
    <!-- ISI Mark Geometric Graphic -->
    <rect x="70" y="30" width="80" height="60" rx="4" fill="none" stroke="#E2E8F0" stroke-width="2" />
    <text x="110" y="48" fill="#E2E8F0" class="mono" font-size="12" font-weight="700" text-anchor="middle">IS 4151</text>
    <text x="110" y="75" fill="#00F0FF" class="mono" font-size="18" font-weight="900" text-anchor="middle">ISI</text>
    <text x="110" y="112" fill="#94A3B8" class="mono" font-size="10" font-weight="600" text-anchor="middle">CM/L-8400129384</text>
    
    <text x="110" y="150" fill="#64748B" class="mono" font-size="9" text-anchor="middle">[PACKAGING SPECIMEN]</text>

    <!-- Laser Scanning Beam over packaging -->
    <line class="laser-line" x1="5" y1="0" x2="215" y2="0" stroke="url(#scanBeam)" stroke-width="2.5" filter="url(#hudGlow)" />
  </g>

  <!-- Center Arrow / Flow Pipeline -->
  <g transform="translate(265, 95)">
    <text x="0" y="0" fill="#38BDF8" class="mono" font-size="20" font-weight="700">→</text>
    <text x="-12" y="22" fill="#64748B" class="mono" font-size="9">Gemini Vision</text>
  </g>

  <!-- Right: Real-Time Forensic HUD Readout -->
  <g transform="translate(350, 30)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="150" height="24" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#10B981" class="hud-blink" />
    <text x="24" y="16" fill="#34D399" class="mono" font-size="11" font-weight="700">STATUS: GENUINE</text>

    <!-- Metrics Breakdown -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" fill="#64748B" class="mono" font-size="11">Standard Code:</text>
      <text x="150" y="0" fill="#F1F5F9" class="mono" font-size="11" font-weight="600">IS 4151:2015 (Helmets)</text>

      <text x="0" y="24" fill="#64748B" class="mono" font-size="11">License (CM/L):</text>
      <text x="150" y="24" fill="#00F0FF" class="mono" font-size="11" font-weight="600">CM/L-8400129384 (Valid)</text>

      <text x="0" y="48" fill="#64748B" class="mono" font-size="11">Label Dimensions:</text>
      <text x="150" y="48" fill="#F1F5F9" class="mono" font-size="11" font-weight="600">1:1.41 Ratio [PASS]</text>

      <text x="0" y="72" fill="#64748B" class="mono" font-size="11">Confidence Score:</text>
      <g transform="translate(150, 62)">
        <rect x="0" y="0" width="140" height="10" rx="3" fill="#1E293B" />
        <rect class="bar-anim" x="0" y="0" width="138" height="10" rx="3" fill="#10B981" />
        <text x="150" y="9" fill="#10B981" class="mono" font-size="10" font-weight="700">99.4%</text>
      </g>

      <text x="0" y="96" fill="#64748B" class="mono" font-size="11">Tamper Probability:</text>
      <text x="150" y="96" fill="#10B981" class="mono" font-size="11" font-weight="700">0.02% (Nominal)</text>
    </g>
  </g>
</svg>
